# Deliberately vulnerable targets for VALIDATING skills locally.
#
# These images are intended to be attacked. Run them only on an isolated host /
# private network — never expose them to the internet. See _lab/README.md.
#
#   docker compose up -d juice-shop
#   docker compose --profile full up -d      # all targets
#
services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: rbs-juice-shop
    ports:
      - "127.0.0.1:3000:3000"   # bound to localhost only
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: rbs-dvwa
    profiles: ["full"]
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  # Optional hardening proxy used by web-security-headers validation.
  hardening-proxy:
    image: nginx:1.27-alpine
    container_name: rbs-hardening-proxy
    profiles: ["full"]
    depends_on: [juice-shop]
    ports:
      - "127.0.0.1:8443:80"
    volumes:
      - ./hardening/nginx-secure-headers.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
