name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Validate skills against the spec
        run: python tools/validate.py

      - name: Check catalog is up to date
        run: python tools/build_catalog.py --check

      - name: Run tooling tests
        run: python -m pytest tools/tests -q
