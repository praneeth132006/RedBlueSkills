name: Publish to npm

# Publishes the `redblueskills` package when a GitHub Release is published.
#
# Auth, in order of preference:
#   1. Trusted publishing (OIDC) — no secret at all. Configure a trusted
#      publisher for the package on npmjs.com (Settings -> Trusted publishing:
#      GitHub Actions, repo praneeth132006/RedBlueSkills, workflow
#      npm-publish.yml). Requires npm >= 11.5.1, which is why Node 24 is pinned
#      below. Only configurable once the package exists on the registry.
#   2. NPM_TOKEN repo secret. This MUST be a granular access token created with
#      the **Bypass 2FA** option ENABLED. That option is off by default, and
#      without it the run dies with `npm error code EOTP` after the tarball is
#      built — the token type is right but it still gets challenged. (Classic
#      automation/publish tokens were removed from npm in November 2025.)
#
# The release tag must match the version in package.json.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"  # ships npm >= 11.5.1, required for OIDC trusted publishing
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Full release gate including packed installation and labs
        run: |
          python -m pip install -r tools/requirements-dev.txt
          make check
          make validate-labs
          npm test

      - name: Sanity-check the CLI + MCP server before publishing
        run: |
          node -c bin/cli.js
          node -c bin/mcp.js
          node bin/cli.js list > /dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node bin/mcp.js | grep -q '"list_skills"'

      - name: Release tag must match package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${TAG#v}"
          pkg=$(jq -r .version package.json)
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      - name: Verify the published file set installs cleanly + ships provenance
        run: |
          npm pack --dry-run
          node bin/cli.js init --dest "$RUNNER_TEMP/verify" > /dev/null
          test "$(find "$RUNNER_TEMP/verify/skills" -name SKILL.md | wc -l | tr -d ' ')" -ge 20
          npm pack --dry-run --json | jq -e \
            '.[0].files | map(.path) | index("sbom.cdx.json") and index("provenance.json")' > /dev/null

      - name: Publish
        run: |
          set -o pipefail
          if npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            exit 0
          fi
          if grep -q "code EOTP" "$RUNNER_TEMP/publish.log"; then
            echo "::error::NPM_TOKEN was challenged for a one-time password, so it was created without the Bypass 2FA option (it is off by default). Regenerate the granular access token on npmjs.com with Bypass 2FA enabled and re-set the NPM_TOKEN secret, or configure trusted publishing and drop the token entirely."
          fi
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
